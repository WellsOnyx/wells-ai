<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Constellation Icon -->
  <g transform="translate(20, 20)">
    <!-- North Star (top) -->
    <path d="M40 5 L38 15 L42 15 Z" fill="#183b6d"/>
    <circle cx="40" cy="15" r="4" fill="#183b6d"/>

    <!-- Connection lines -->
    <line x1="40" y1="19" x2="20" y2="50" stroke="#183b6d" stroke-width="1"/>
    <line x1="40" y1="19" x2="40" y2="60" stroke="#183b6d" stroke-width="1"/>
    <line x1="40" y1="19" x2="60" y2="50" stroke="#183b6d" stroke-width="1"/>

    <!-- Orbiting stars -->
    <circle cx="20" cy="50" r="3" fill="#183b6d"/>
    <circle cx="60" cy="50" r="3" fill="#183b6d"/>
    <circle cx="40" cy="60" r="3" fill="#183b6d"/>

    <!-- Gold accent on center star -->
    <circle cx="40" cy="15" r="2" fill="#dba63f" opacity="0.8"/>
  </g>

  <!-- WELLS text -->
  <text x="100" y="55" font-family="Montserrat, sans-serif" font-size="48" font-weight="700" fill="#183b6d" letter-spacing="-1">
    WELLS
  </text>

  <!-- AI text with gold accent -->
  <text x="255" y="55" font-family="Montserrat, sans-serif" font-size="48" font-weight="300" fill="#183b6d" letter-spacing="2">
    AI
  </text>

  <!-- Tagline -->
  <text x="100" y="80" font-family="Montserrat, sans-serif" font-size="11" font-weight="400" fill="#9ea1a7" letter-spacing="3" text-transform="uppercase">
    CONVERSATIONAL COMMERCE
  </text>
</svg>
