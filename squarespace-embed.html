<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Wells AI Embed - Full Page */
    .wells-ai-embed {
      width: 100%;
      height: 100vh;
      min-height: 600px;
      border: none;
      display: block;
      margin: 0;
      padding: 0;
    }

    /* Remove any default spacing */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <iframe
    src="https://wellsai.vercel.app?embed=true"
    class="wells-ai-embed"
    title="Wells AI Conversational Commerce Platform"
    loading="lazy"
    allow="clipboard-write"
  ></iframe>
</body>
</html>
