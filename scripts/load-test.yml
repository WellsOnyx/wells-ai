# Artillery Load Test Configuration
# Tests Wells AI for 100 concurrent users with <2s response time
# Run with: npm run test:load

config:
  target: "https://wellsai.vercel.app"
  phases:
    # Warm-up: Gradually increase to 20 users over 2 minutes
    - duration: 120
      arrivalRate: 1
      rampTo: 20
      name: "Warm-up phase"

    # Ramp-up: Increase to 50 users over 3 minutes
    - duration: 180
      arrivalRate: 20
      rampTo: 50
      name: "Ramp-up to 50 users"

    # Peak load: Sustain 100 concurrent users for 5 minutes
    - duration: 300
      arrivalRate: 100
      name: "Peak load - 100 concurrent users"

    # Spike test: Sudden increase to 150 users for 2 minutes
    - duration: 120
      arrivalRate: 150
      name: "Spike test"

    # Cool-down: Gradually decrease to 10 users
    - duration: 120
      arrivalRate: 100
      rampTo: 10
      name: "Cool-down"

  # Performance thresholds (test fails if exceeded)
  ensure:
    maxErrorRate: 1 # Max 1% error rate
    p95: 2000 # 95th percentile under 2 seconds
    p99: 3000 # 99th percentile under 3 seconds

  # Plugins for advanced reporting
  plugins:
    expect: {}
    metrics-by-endpoint:
      stripQueryString: true

  # Variables for test data
  variables:
    categories:
      - ["steel", "manufacturing"]
      - ["electronics", "components"]
      - ["packaging", "shipping"]
      - ["software", "development"]

    messages:
      - "I need steel suppliers in Ohio"
      - "Find me electronics manufacturers"
      - "Looking for packaging solutions"
      - "Need software development partners"

# Test scenarios
scenarios:
  # Scenario 1: Homepage load
  - name: "Homepage Load"
    weight: 10
    flow:
      - get:
          url: "/"
          expect:
            - statusCode: 200
            - contentType: text/html

  # Scenario 2: AI Chat conversation
  - name: "AI Chat Conversation"
    weight: 30
    flow:
      - post:
          url: "/api/chat"
          json:
            message: "{{ messages }}"
            sessionId: "test-{{ $randomString() }}"
          expect:
            - statusCode: 200
            - contentType: json
            - hasProperty: response
          capture:
            - json: "$.response"
              as: "chatResponse"

      # Follow-up message
      - think: 2 # Wait 2 seconds (simulate user reading)
      - post:
          url: "/api/chat"
          json:
            message: "Tell me more about that"
            sessionId: "test-{{ $randomString() }}"
          expect:
            - statusCode: 200

  # Scenario 3: Supplier matching (with cache)
  - name: "Supplier Matching"
    weight: 25
    flow:
      - post:
          url: "/api/suppliers/cached"
          json:
            categories: "{{ categories }}"
          expect:
            - statusCode: 200
            - contentType: json
            - hasProperty: suppliers
          capture:
            - json: "$.suppliers[0].id"
              as: "supplierId"

      # Fetch supplier details
      - get:
          url: "/api/suppliers/{{ supplierId }}"
          expect:
            - statusCode: 200

  # Scenario 4: Quote browsing
  - name: "Quote Browsing"
    weight: 20
    flow:
      - get:
          url: "/quotes"
          expect:
            - statusCode: 200
            - contentType: text/html

      - think: 3 # Simulate user reviewing quotes

  # Scenario 5: Analytics dashboard
  - name: "Analytics Dashboard"
    weight: 10
    flow:
      - get:
          url: "/analytics"
          expect:
            - statusCode: 200

      - get:
          url: "/api/analytics/dashboard?range=7d"
          expect:
            - statusCode: 200
            - contentType: json

  # Scenario 6: Payment flow
  - name: "Payment Flow"
    weight: 5
    flow:
      - get:
          url: "/payment"
          expect:
            - statusCode: 200

      - post:
          url: "/api/payments/create"
          json:
            amount: 45000
            currency: "usd"
            buyerEmail: "test@example.com"
            dealId: "test-deal-{{ $randomNumber(1, 10000) }}"
          expect:
            - statusCode: 200
            - hasProperty: paymentIntent
